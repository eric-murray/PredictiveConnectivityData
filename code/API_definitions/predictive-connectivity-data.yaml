openapi: 3.0.3
info:
  title: Predictive Connectivity Data
  description: |
    The Predictive Connectivity Data API provides estimated connectivity quality information for a specified geographic area, time interval and height, delivered by 4G/5G networks.

    # Introduction

    The Predictive Connectivity Data API allows API consumers to retrieve estimations of connectivity quality in each grid cell of a given area for a future time interval. The resulting data is prepared by the API provider, derived from network data and/or prediction models trained on such data. The API supports both synchronous and asynchronous processing depending on the size and complexity of the request.

    - The defined **area** is either a polygon (a list of geographical coordinates) or a list of geohashes.
    - The provided **time interval** is a future time interval defined by `startTime` and `endTime`.
    - An optional **height** in metres above ground level can be specified to obtain connectivity data for a specific altitude layer.
    - The resulting estimations include a **connectivity level** (`GC`, `MC`, `NC`, or `ND`) for each cell, each time slot, and each vertical layer. Optionally, if supported by the implementation and requested by the API Consumer, raw **signal strength** values in dBm can also be returned.

    This API supports a wide range of use cases, including but not limited to:

    - **BVLOS (Beyond Visual Line of Sight) drone operations**, supporting drone flight planning with detailed analysis of mobile network coverage in the airspace across specific geographic areas.
    - **Autonomous vehicle route planning**, enabling route optimization through in-depth evaluation of mobile network availability along planned routes.

    These examples illustrate typical applications, but the API can be used in many other scenarios where predictive connectivity estimation is relevant.

    # Relevant Terms and Definitions

    **Connectivity Level**
    A qualitative classification of expected connectivity quality for a given cell, time slot and layer, relative to the requested `serviceLevel` and `networkType`:
    - **GC** (Good Connectivity): Service level met even in unfavorable conditions.
    - **MC** (Marginal Connectivity): Service level might not be met.
    - **NC** (No Connectivity): Service level not met.
    - **ND** (No Data): No connectivity data available.

    **Service Level**
    Describes, in measurable terms, the quality of service a telecommunication provider furnishes a consumer. The currently defined service levels are:
    - **C2**: Command and Control. Connecting an unmanned aerial vehicle with its remote controller.
    - **STREAM_4K**: Streaming in 4K quality.
    - **BEST_EFFORT**: A qualitative estimation of coverage based on operator prediction models or public coverage maps, without guarantees of network performance.

    The API provider (mobile network operator) may not support every service level. If the requested service level is not supported, the API returns `422 PREDICTIVE_CONNECTIVITY_DATA.UNSUPPORTED_SERVICE_LEVEL`.

    **Network Type**
    The type of connectivity (4G or 5G) for which to retrieve data. If not specified, connectivity quality is returned considering both 4G and 5G networks.

    **AGL (Above Ground Level)**
    The vertical height above the ground, in metres. Used to define the prediction height and to describe the vertical layering of connectivity data.

    **Layer**
    A vertical subdivision of the airspace above a grid cell. All layers have the same thickness (`layerThickness` metres) and are ordered consecutively starting from the ground (index 0 = 0 m AGL). The layer at index N covers the altitude range from N x `layerThickness` to (N+1) x `layerThickness` metres AGL.

    **Signal Strength**
    Raw signal strength predictions in dBm that can be optionally included in the response when supported by the implementation and requested via `includeSignalStrength`.

    **Area Types**
    - **POLYGON**: Area defined by a list of latitude/longitude points forming a simple polygon. The polygon is subdivided into a grid of cells. The set of cells corresponds to the geohashes, at the requested precision, that cover the polygon.
    - **GEOHASHLIST**: Area defined as a list of geohash strings. Geohashes may be individual, non-contiguous geographical areas each with their own (possibly different) precision.

    **Grid Cell**
    A subdivision of the requested area.
    - For polygon areas, the grid is the set of geohash cells, at the applicable precision level, that cover the polygon. All cells have the same precision level.
    - For geohash lists, each geohash corresponds to a single cell at its own precision level.

    **Geohash**
    A geohash is a string-encoded representation of a geographical area/point on the globe. The (32-base) geohash model represents the globe as a grid of 32 fixed rectangular areas, referred to as cells. Each cell is identified by a single letter or digit. Zooming in to one cell (recursively) gives a more granular (or higher precision) 32-cell grid at the next level with each cell again identified by a single letter or digit.
    The geohash is a string that identifies a cell at a given zoom level by concatenating the identifiers of all previous level grid cells selected. The deeper the zoom, the longer the string and the higher the granularity/precision of the cell. The maximum zoom/precision level supported by this API is 12, which gives grid cells with a maximum dimension of 37.2 mm or less. The length (number of characters) of the geohash indicates its precision (zoom level/granularity). More information can be found at [Geohash system](https://en.wikipedia.org/wiki/Geohash).

    **Precision**
    Defines the granularity level of grid cells.
    - **POLYGON**: The precision level is given by the `precision` request property. If not included, the default precision level 7 is used.
    - **GEOHASHLIST**: Each geohash's own length determines its precision. The `precision` property MUST NOT be included.

    **Mobile Network Coverage Area**
    The geographic area where the Mobile Network Operator (MNO) provides connectivity services. Cells outside this area are returned with all connectivity values set to `ND`.

    **Synchronous vs Asynchronous Processing**
    - **Synchronous**: The API returns the result immediately in the response.
    - **Asynchronous**: For large requests or when explicitly requested via `sink`, the API returns a `202` response with an `operationId` and later delivers the result to the callback URL, including the same `operationId`.

    **OperationId**
    A unique identifier generated by the API Provider to correlate an asynchronous request with its callback notification. It is mandatory in the 202 response and in the callback payload. It differs from `x-correlator` (which is optional, supplied by the API Consumer, and not guaranteed to be present or unique).

    **Callback URL and Token**
    A callback URL (`sink`) may be provided to receive asynchronous results. When `sink` is used, it is RECOMMENDED for the API Consumer to also provide `sinkCredential` to secure the callback endpoint. Supported credential types are `ACCESSTOKEN` and `PRIVATE_KEY_JWT`.

    # API Functionality

    To retrieve predictive connectivity data, the API consumer specifies:
    1. The **area** (polygon or geohash list)
    2. The **precision** (only for polygon areas; defaults to 7 if omitted)
    3. The **service level** (currently one of C2, STREAM_4K, or BEST_EFFORT)
    4. The **time interval** (`startTime` and `endTime`)
    5. Optionally, a **height** in metres AGL to limit predictions to a single layer
    6. Optionally, a **network type** (4G or 5G; both if omitted)
    7. Optionally, **includeSignalStrength** to request raw dBm values

    The API returns a sequence of time slots covering the specified interval. Each time slot contains connectivity data for all the grid cells covering the requested area.

    - For polygon areas, the API generates a grid of geohash cells at the requested precision level that cover the polygon.
    - For geohash lists, each geohash corresponds to a single cell, and the `precision` property MUST NOT be included.

    Connectivity levels are calculated based on network data and/or prediction models trained on such data.

    Polygon areas must meet certain constraints:
    - Maximum polygon area size (implementation-specific).
    - Must have a minimum of 3 and can have a maximum of 15 geographical points defining the polygon.
    - Must lie at least partially within the mobile network coverage area; otherwise, the response has `status` set to `AREA_NOT_SUPPORTED` and an empty array is returned.

    For geohash lists:
    - Support for `POLYGON` is mandatory for all API providers, whilst support for `GEOHASHLIST` is optional. If the API provider does not support `GEOHASHLIST`, the API returns `422 PREDICTIVE_CONNECTIVITY_DATA.UNSUPPORTED_AREA_TYPE`.
    - Geohashes may be non-contiguous and have varying precision.
    - Unsupported geohash precisions result in `422 PREDICTIVE_CONNECTIVITY_DATA.UNSUPPORTED_PRECISION`.
    - Geohashes outside coverage are returned with `layerConnectivities` containing all items set to `ND`.
    - If all geohashes are outside coverage, the response status is `AREA_NOT_SUPPORTED`.

    The API normally behaves synchronously. However, large requests may trigger asynchronous processing. API Consumers may request asynchronous behavior by providing a `sink` callback URL. If asynchronous processing is not supported, the API returns `422 PREDICTIVE_CONNECTIVITY_DATA.UNSUPPORTED_ASYNC_RESPONSE`.

    Three mutually exclusive `422` errors indicate why a request cannot be served. They are evaluated in this order:
    - **PREDICTIVE_CONNECTIVITY_DATA.UNSUPPORTED_ASYNC_RESPONSE**: `sink` is provided but asynchronous processing is not supported by the API provider. It does not depend on the size of the request; the API consumer can retry the same request without `sink` to obtain a synchronous response.
    - **PREDICTIVE_CONNECTIVITY_DATA.UNSUPPORTED_SYNC_RESPONSE**: The request is too large for synchronous processing, and asynchronous processing has not been requested. A smaller request for a synchronous response may succeed.
    - **PREDICTIVE_CONNECTIVITY_DATA.UNSUPPORTED_REQUEST**: The request is too large for both synchronous and asynchronous processing. The requested coverage area and/or precision must be reduced.

    If an error occurs during asynchronous processing, the callback includes `status = OPERATION_NOT_COMPLETED` and a `statusInfo` field with additional details.

    # Resources and Operations Overview

    The API exposes a single POST endpoint (`/retrieve`) for retrieving predictive connectivity data for a specified area, service level, network type, and time interval.
    The API call result is an array of time slots (`timedConnectivityData`), with per time slot an array of cells (`cellConnectivityData`), with for each cell the connectivity levels per vertical layer (see **Connectivity Level** in the definitions above).

    When an asynchronous response is requested (using `sink`, see Callback URL and Token in the Relevant Terms and Definitions section above), the 202 response of the API will include an `operationId` property. This `operationId` property will also be sent in the callback payload, correlating the asynchronous response with its corresponding request. If provided, `sinkCredential.credentialType` MUST be set to `ACCESSTOKEN` or `PRIVATE_KEY_JWT`.

    Using `credentialType: PRIVATE_KEY_JWT` requires the JWT authentication parameters (a.k.a. JWK Set) to be pre-configured by an agreement between the API consumer and the API provider as part of the onboarding process. The API never returns `sinkCredential`, so the API provider's `jwksUri` is never conveyed in the response. Unlike an event subscription, the `/retrieve` operation creates no resource to read back, the same static `jwksUri` would be repeated on every `202` response, and the callback may be delivered before the API consumer has processed that response. If `PRIVATE_KEY_JWT` is provided and no JWK Set is configured for the API consumer, the API returns the error response `422 PRIVATE_KEY_JWT_NOT_CONFIGURED`. A failure to authenticate against the API consumer's authorization server when the callback is delivered cannot be detected while the request is being processed, and is therefore reported in the callback with property `status` set to `OPERATION_NOT_COMPLETED`.

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->
